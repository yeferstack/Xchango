<header class="header">
  <!-- IZQUIERDA: logo y buscador -->
  <div class="header__izq">
    <a class="logo" routerLink="/home" aria-label="Ir al inicio">
      <img src="Logo-xchango/chango.png" alt="" class="logo__chango" />
      <img src="Logo-xchango/letras-chango.png" alt="XchanGo" class="logo__letras" />
    </a>

    <div class="search">
    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      type="text"
      placeholder="Buscar trueques..."
      [ngModel]="busqueda"
      (ngModelChange)="onBusquedaChange($event)"
      class="search__input"
    />
    </div>
  </div>

  <!-- CENTRO: menú -->
  <nav class="nav">
      <a
        class="nav__item"
        [class.nav__item--active]="!mostrarSoloFavoritos"
        href="javascript:void(0)"
        (click)="onInicio()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"></path>
          <path d="M5 9.5V21h14V9.5"></path>
          <path d="M9.5 21v-6h5v6"></path>
        </svg>
        Inicio
      </a>

      <a class="nav__item" routerLink="/mis-trueques">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h13"></path><path d="m14 5 3 3-3 3"></path>
          <path d="M20 16H7"></path><path d="m10 19-3-3 3-3"></path>
        </svg>
        Mis trueques
      </a>

      <a
        class="nav__item"
        [class.nav__item--active]="mostrarSoloFavoritos"
        href="javascript:void(0)"
        (click)="onFavoritos()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20s-7-4.4-7-9.4A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.6c0 5-7 9.4-7 9.4z"></path>
        </svg>
        Favoritos
        <span class="nav__count" *ngIf="cantidadFavoritos > 0">{{ cantidadFavoritos }}</span>
      </a>
    </nav>


  <!-- DERECHA: publicar, avisos y perfil -->
  <div class="header__right">

    <!-- Acción principal: antes estaba en la barra lateral -->
    <button class="btn-publicar" type="button" (click)="irAPublicar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14"></path><path d="M5 12h14"></path>
      </svg>
      Publicar un trueque
    </button>

    <button class="icon-btn" type="button" aria-label="Notificaciones" (click)="irANotificaciones()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15V10a6 6 0 1 0-12 0v5l-2 3h16z"></path>
        <path d="M10 21h4"></path>
      </svg>
      <span class="icon-btn__badge" *ngIf="notificaciones > 0">{{ notificaciones }}</span>
    </button>

    <button class="avatar-btn" type="button" (click)="irAPerfil()" title="Ver mi perfil">
      <img [src]="avatarUrl" alt="Foto de perfil" class="avatar-btn__img" />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
</header>
