<div class="ac">

  <a routerLink="/login" class="ac__marca">
    <img src="Logo-xchango/chango.png" alt="Logo XchanGo" class="ac__marca-chango" />
    <img src="Logo-xchango/letras-chango.png" alt="XchanGo" class="ac__marca-wordmark" />
  </a>

  <form class="ac__card" (ngSubmit)="entrar()" *ngIf="!mostrarVerificacion()">
    <div class="ac__logo">
      <img src="Logo-xchango/chango.png" alt="" class="ac__logo-chango" />
    </div>

    <h1 class="ac__title">Entrar a XchanGo</h1>
    <p class="ac__sub">Intercambia bienes y servicios en Casanare.</p>

    <label class="ac__label" for="ac-email">Correo</label>
    <input id="ac-email" class="ac__input" type="email" name="email"
      placeholder="tucorreo@mail.com" [(ngModel)]="email" required />

    <label class="ac__label" for="ac-pass">Contraseña</label>
    <input id="ac-pass" class="ac__input" type="password" name="password"
      placeholder="Tu contraseña" [(ngModel)]="password" required />

    <p class="ac__error" *ngIf="error()">{{ error() }}</p>

    <button class="ac__btn" type="submit">Iniciar sesión</button>

    <p class="ac__foot">
      ¿No tienes cuenta? <a routerLink="/formulario">Regístrate</a>
      · <a routerLink="/login">Volver al inicio</a>
    </p>
  </form>

  <app-verificar-codigo
    *ngIf="mostrarVerificacion()"
    [correo]="email"
    (verificado)="onCodigoVerificado()"
    (volver)="mostrarVerificacion.set(false)"
  ></app-verificar-codigo>

</div>
